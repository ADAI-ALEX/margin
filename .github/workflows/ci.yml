name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the Playwright e2e job (desktop project against next start)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, claims, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Banned-claims lint (Kickoff §H.12)
        run: npm run lint:claims
      - name: Unit, data and science tests (vitest)
        run: npm test
      - name: Build (static generation; no network calls to PSI/NTRS)
        run: npm run build
      - name: No secrets in the client bundle (Kickoff §H.11)
        run: |
          if grep -rIlE 'sk-ant-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' .next/static; then
            echo "::error::secret-like token found in .next/static"; exit 1
          fi

  e2e:
    name: E2E (Playwright, desktop)
    needs: check
    # Runs on push/PR; on manual dispatch it can be switched off with the run_e2e input.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          nohup npx next start -p 3000 -H 127.0.0.1 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 1; done
          echo "::error::next start did not come up"; cat next-start.log; exit 1
      - name: Playwright (desktop project)
        run: npx playwright test --project=desktop
      - name: Server log
        if: failure()
        run: cat next-start.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
